<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Brawler:wght@400;700&family=Moul&display=swap');
    </style>
    <style>
        section {
            background: linear-gradient(to top, rgb(31, 223, 253), rgb(210, 100, 247));
            width: 100%;
            height: 600px;
            text-align: center;
            margin-top: 50px;
            
        }

        .text {
            padding-top: 140px;

        }

        .text h1 {
            font-family: "Moul", serif;
            font-weight: 400;
            background: linear-gradient(to right, #6bff7c, #5789fe, #fb4866);

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .gradient-text {
            font-size: 26px;
            font-weight: bold;
            background: linear-gradient(to right, #ff6bd8, #feca57, #48dbfb);

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        
    </style>
</head>

<body>

    <section>

        <div class="text">
            <h1>
                Dangling Pointers ( Pointer អនាថា )
            </h1>
            <p class="gradient-text">
                កើតឡើងនៅពេល Pointer ចង្អុលទៅកាន់អាសយដ្ឋានមួយដែលត្រូវបានលុបចោល ឬហួសសុពលភាពទៅហើយ។
            </p>

        </div>
    </section>
   
</body>

</html>
