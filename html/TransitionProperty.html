<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            margin: auto;
            width: 150px;
            height: 150px;
            background-color: palevioletred;
            transition: 0.4 s ease 0.2s;
        }

        .box:hover {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background-color: aqua;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
