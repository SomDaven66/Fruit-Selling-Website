<!doctype html>
<html lang="km">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Card</title>
    <link rel="stylesheet" href="../css/chanthy.css" />
  </head>
  <body>
    <div class="box">
      <div class="profile-card">
        <div class="profile-img">
          <img src="https://i.pinimg.com/1200x/09/1f/da/091fda46ca81a1bf8148c9bfb1b5e808.jpg"
            alt="Profile"/>
        </div>
        <div class="text">
          <h2 class="profile-name">ថា​ ចន្ធី</h2>

          <p class="profile-bio">
            សួស្តី! ខ្ញុំជានិស្សិតដែលមានចំណង់ចំណូលចិត្តលើការអភិវឌ្ឍន៍គេហទំព័រ
            (Web Development)។ ខ្ញុំស្រឡាញ់ការរៀនបច្ចេកវិទ្យាថ្មីៗ ការរចនា
            Website ឱ្យមានភាពស្រស់ស្អាត និងងាយស្រួលប្រើប្រាស់
            ហើយខ្ញុំតែងតែខិតខំអភិវឌ្ឍ ជំនាញរបស់ខ្លួនជានិច្ច។
          </p>

          <button class="btn-contact">Contact Me</button>
        </div>
      </div>
    </div>
  </body>
</html>
