<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
        }
        :root{
            --primary-color: red;
            --font-size: 3rem;

        }
        @media screen and(min-width:768px) {
            :root{
                --primary-color:rgb(21, 255, 0);
                --font-size: 5rem;
            }
        }
        @media screen and(min-width:1200px) {
            :root{
                --primary-color:rgb(0, 208, 255);
                --font-size: 7rem;
            }
        }
        h1{
            color: var(--primary-color);
            font-size: var(--font-size);
        }

        p{
            color: var(--primary-color);
            font-size: var(--font-size);
        }

    </style>
</head>
<body>
    <h1>Welcome you to my Pink World</h1>
    <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Error laboriosam similique tenetur vero quam quos!</p>
</body>

</html>
