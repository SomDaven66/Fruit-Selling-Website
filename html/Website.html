<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/Website.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Battambang:wght@100;300;400;700;900&family=Brawler:wght@400;700&family=Cherish&family=Konkhmer+Sleokchher&family=Moul&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Taprom&display=swap"
        rel="stylesheet">

</head>

<body>
    <header>
        <nav>
            <!-- logo -->
            <div class="logo">
                <img src="../Images/image.png" alt="">
            </div>

            <!-- menu -->
            <div class="menu">
                <!-- search bar -->
                <input class="search" type="text" placeholder="Search here...">
                <i class="fa-solid fa-magnifying-glass"></i>
                <ul>
                    <li>Home</li>
                    <li>About</li>
                    <li>Profile</li>
                    <li>Contact</li>
                </ul>
            </div>

            <!-- icon -->
            <div class="icon">
                <i class="fa-regular fa-heart"></i>
                <i class="fa-regular fa-bell"></i>
            </div>
        </nav>
    </header>

    <!-- Main Website -->
    <main>

        <!-- left -->
        <div class="text">
            <h2>Make healthy </h2>
            <h2>life with fresh fruits</h2>
            <button class="button">Fresh fruits</button>
        </div>

        <!-- right -->
        <div class="image">
            <img src="https://i.pinimg.com/vwebp/736x/d2/e2/2a/d2e22a4a063ac39dc25c3638e7fc8ec6.webp"
                alt="fresh fruits">
        </div>
    </main>

    <!-- Featured Categories -->
    <section>
        <div class="Categories">
            <h4>Featured Categories</h4>
            <span>View more</span>
        </div>

        <!-- mini cart -->
        <div class="mini_cart">
            <div class="cart">
                <img class="berries"
                    src="https://i.pinimg.com/vwebp/1200x/68/f7/eb/68f7eb30d384c4b566719f9af1c7ccc6.webp" alt="">
                <p style="text-align: center; font-size: 20px; margin-top: 10px;">Berries</p>
            </div>
            <div class="cart">
                <img class="cherry" src="https://i.pinimg.com/736x/21/cb/fc/21cbfcc0be1115b487053ea488c9ce1f.jpg"
                    alt="">
                <p style="text-align: center; font-size: 20px; margin-top: 10px;">Cherry</p>

            </div>
            <div class="cart">
                <img class="cherry" src="https://i.pinimg.com/736x/c4/d9/d5/c4d9d5aad48d931919c1c8ce75cfe9d0.jpg"
                    alt="">
                <p style="text-align: center; font-size: 20px; margin-top: 10px;">pomegranate</p>
            </div>
            <div class="cart">
                <img class="cherry" src="https://i.pinimg.com/736x/5c/80/ea/5c80eada38428d661a4f616bd20238fb.jpg"
                    alt="">
                <p style="text-align: center; font-size: 20px; margin-top: 10px;">Avocado</p>
            </div>
            <div class="cart">
                <img class="cherry" src="https://i.pinimg.com/vwebp/1200x/32/62/a5/3262a55599b7e5f5c31f02fb83705081.webp"
                    alt="">
                <p style="text-align: center; font-size: 20px; margin-top: 10px;">Kiwi</p>
            </div>
            
        </div>
    </section>


    <!-- hero website -->

    <section>
        <div class="hero">

            <!-- left -->
             <div class="left">
                <div class="dis">For 30% Discount</div>
                <p style="font-size: 40px; margin-top: 30px; font-weight: bold;">Purely Fresh Fruits</p>
                <p style="font-size: 40px; margin-top: 15px; margin-left: 30px; font-weight: bold;">directly From Farmers </p>
                <button class="btn">Order Now</button>
            </div>

             <!-- right -->
              <div class="right">

              </div>
        </div>
    </section>

    <!-- Carts -->
    <section>
        <div class="carts">

        <!-- text -->
        <div class="product_text">
            <span>Discount 5%</span>
            <h3>Featured Products</h3>
        </div>


        <!-- Product Carts -->
         <!-- row1 -->
          <div class="product_card">

              <div class="card">
                <img src="" alt="">
              </div>
              <div class="card"></div>
              <div class="card"></div>
              <div class="card"></div>
          </div>
        </div>
    </section>
</body>

</html>
